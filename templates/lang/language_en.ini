H_SICHER = "About the token in the address"
SICHER = "The token appears in clear text in the address of the virtual output. There is no way around this in Loxone — a virtual output cannot send a header of its own. The call stays inside the home network, so the important part is <b>not</b> to expose the LoxBerry to the internet through port forwarding."

