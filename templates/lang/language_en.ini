CURL_TEXT = "The plugin still works — it uses PHP streams instead of cURL. To install it on the LoxBerry (SSH): <span class='sm-mono'>sudo apt-get update &amp;&amp; sudo apt-get install -y php-curl</span>. The <span class='sm-mono'>apt-get update</span> matters: if the install fails with „404 Not Found“ on packages.sury.org, only the package index is stale."
SOCKETS_TITEL = "The PHP extension <span class='sm-mono'>sockets</span> is missing."
SOCKETS_TEXT = "Without it the plugin can send <b>neither UDP nor MQTT</b> — it will fetch the data, but nothing arrives in Loxone. To install: <span class='sm-mono'>sudo apt-get install -y php-sockets</span>."

