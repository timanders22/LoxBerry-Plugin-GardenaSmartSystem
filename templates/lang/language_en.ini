MQTT_ZEICHEN = "Only letters, digits, <span class='sm-mono'>_</span>, <span class='sm-mono'>-</span> and <span class='sm-mono'>/</span> are allowed in a topic. Device names are rewritten accordingly — a <span class='sm-mono'>#</span> or <span class='sm-mono'>+</span> in the name would otherwise be read as an MQTT wildcard."
ZUGANG_TITEL = "Credentials (one-off):"
ZUGANG_TEXT = "Sign in at <a href='https://developer.husqvarnagroup.cloud/' target='_blank'>developer.husqvarnagroup.cloud</a> with your GARDENA/Husqvarna account → <b>Create application</b> → under <b>Connect an API</b> connect the „GARDENA smart system API“ → enter the application key and secret here. Signing in with a user name and password no longer works (the old API was shut down)."
CURL_TITEL = "The PHP extension <span class='sm-mono'>php-curl</span> is missing."
CURL_TEXT = "The plugin still works — it uses PHP streams instead of cURL. To install it on the LoxBerry (SSH): <span class='sm-mono'>sudo apt-get update &amp;&amp; sudo apt-get install -y php-curl</span>. The <span class='sm-mono'>apt-get update</span> matters: if the install fails with „404 Not Found“ on packages.sury.org, only the package index is stale."
SOCKETS_TITEL = "The PHP extension <span class='sm-mono'>sockets</span> is missing."
SOCKETS_TEXT = "Without it the plugin can send <b>neither UDP nor MQTT</b> — it will fetch the data, but nothing arrives in Loxone. To install: <span class='sm-mono'>sudo apt-get install -y php-sockets</span>."

