[LOX]
K_VORLAGE_UDP = "Create template for the UDP path"
VORLAGE_ADRESSE = "The UDP template carries the presumed address of the LoxBerry. It is a suggestion — please check it in Loxone Config, the Miniserver must see the LoxBerry at exactly that address."
H_BAUSTEINE = "Step by step: the blocks"
BAUSTEINE_TEXT = "Four pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“GARDENA smart system”</b> shows whether the plugin is running and whether all devices have radio and battery (for everybody), <b>“… Mähroboter”</b>, <b>“… Ventil”</b> and <b>“… Sensor und Steckdose”</b> show and control one kind of device each – if you do not have a device, leave out its page. Per page: instructions, table (work through it from top to bottom), notes and picture. The values come in through Virtual Inputs with the names of the MQTT gateway (step 3), the commands go out through the shared output “LoxBerry MQTT-Gateway” (step 4). The names of the inputs and commands apply to your own devices (per kind the first one in the device cache) and the configured base topic; without a cache the example names of the sample project appear. Loxone Config finds the blocks via the block search (F5)."
S_BAUSTEIN = "Block (type)"
S_NAME = "Name"
S_PARAMETER = "Parameter"
S_EINGAENGE = "Connect inputs to"
S_EINGANG = "Input"
ZU_9 = "On the notifications:"
ZU_9_TEXT = "The notification block only fires on the transition from off to on. Never wire several sources straight to its input — merge them through OR first, otherwise a permanently active source swallows all the others."
ZU_ANSAGE = "Speech output:"
ZU_ANSAGE_TEXT = "The announcements (Settings tab) are triggered by the plugin's own poll, not by Loxone – no new block is needed for them."
H_LEERE_WERTE = "Values the cloud does not supply"
LEERE_WERTE = "If GARDENA reports a numeric attribute <b>without</b> a value, since 1.2.21 a substitute value goes out over MQTT <b>and</b> over UDP: <b>-1</b> for battery, radio, soil moisture, brightness and operating hours, <b>-999</b> for soil and air temperature (-1 °C is a real value), <b>0</b> for the numeric fields online, maeht, station, offen, an and stoerung (they mean “1 for a known value, otherwise 0”). Texts and unknown attributes go out as <b>-</b> over MQTT, nothing over UDP. Up to 1.2.20 MQTT sent “-”, which an analog input read as 0 (“battery 0 %”), and UDP sent nothing. An <b>empty string</b> goes out as <b>-</b> over MQTT; over UDP it is a value, the line then ends with the colon and a virtual input with command recognition reads <b>0</b> from it. If a device or an attribute drops out of the cloud’s answer, its retained states read the substitute value or <b>-</b> afterwards. If an existing installation checks for “= 0”, it will see -1 or -999 from now on."
H_AUSFALL = "The heartbeat in detail"
AUSFALL = "If the cloud goes quiet, the inputs keep their last value and everything looks normal in the app. The plugin therefore sends a heartbeat on <b>every</b> cron run, even after an abort and even when no poll happens because of the configured interval or a polling lock: <span class='sm-mono'>&lt;base&gt;/Plugin/STATUS/ok</span> (1 = last poll complete, 0 = abort or failed send attempts), <span class='sm-mono'>…/zaehler</span> (advances on every run), <span class='sm-mono'>…/werte</span>, <span class='sm-mono'>…/fehler</span> in plain text (a hyphen means: no error), plus <span class='sm-mono'>…/zeitstempel</span> and <span class='sm-mono'>…/ts</span> for existing installations; over UDP <span class='sm-mono'>STATUS.Plugin.&lt;name&gt;</span>. Never retained. For the Value Validator <span class='sm-mono'>zaehler</span> is the sign of life (step 5) – do not compute an age from a time stamp: Loxone calculates in local time. “Sent” means the LoxBerry sent the packet — it cannot know whether it arrived."
H_VORLAGE = "Templates for existing installations"
H_VORLAGE_TEXT = "The UDP template creates the inputs of the UDP path, the command template the HTTP commands with token. <b>Note:</b> Loxone Config always creates new objects on import – importing twice yields duplicate blocks."
H_VORLAGE_TEXT2 = "The names come from the last Gardena response (device cache); only numeric values are included, together with the numeric fields online, maeht, station, offen, an and stoerung. The limits accept the substitute values (MinVal -1 or -999). The former template for the MQTT inputs (Virtual HTTP Input with http://localhost) no longer exists since 1.2.21 – whoever imported it keeps the inputs; the names are the same as in the name table."
K_VORLAGE_VO = "Create command template"
VORLAGE_KEIN_ABBILD = "No device cache yet – the template can only be created after the plugin has fetched successfully once (tab <i>Test</i>, fetch now)."

