; Gardena Smart System - English
;
; This file is the FALLBACK for every language other than German - it must
; always be complete. Every key used anywhere must exist here.
; Quote every value: with parse_ini_file a ; starts a comment, and every
; HTML entity ends in a semicolon (→ – ü). A value must not
; contain a double quote - use single quotes for HTML attributes:
; <span class='sm-mono'>.

