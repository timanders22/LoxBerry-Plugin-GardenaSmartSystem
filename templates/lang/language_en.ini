ZU_7_TEXT = "The timestamp changes with every successful poll and retriggers the staircase light switch. If it drops out, nothing has arrived for half an hour. Set the hold time well above the configured interval so a single missed run does not raise an alarm."
ZU_9 = "On #9:"
ZU_9_TEXT = "The notification block only fires on the transition from off to on. Never wire several sources straight to its input — merge them through OR first, otherwise a permanently active source swallows all the others."
H_LEERE_WERTE = "Values the cloud does not supply"
LEERE_WERTE = "If GARDENA reports an attribute <b>without</b> a value, the plugin sends nothing for it — the virtual input keeps its last value. An <b>empty string</b>, however, is a value and is sent; the UDP line then ends with the colon (<span class='sm-mono'>SERVICE.device.attribute:</span>) and a virtual input with command recognition reads <b>0</b> from it. For an attribute that can become empty — an error code being cleared, say — use a text input or evaluate it over MQTT."
H_AUSFALL = "Failure detection"
AUSFALL = "If the cloud goes quiet, the virtual inputs keep their last value and everything looks normal in the app. The plugin therefore sends a heartbeat on <b>every</b> run, even after an abort: <span class='sm-mono'>STATUS.Plugin.ok</span> (1 = run completed, 0 = abort or lost values), <span class='sm-mono'>STATUS.Plugin.zeitstempel</span> (Loxone time of the last successful poll, 0 = never), <span class='sm-mono'>STATUS.Plugin.werte</span> and <span class='sm-mono'>STATUS.Plugin.fehler</span> in plain text (a hyphen means: no error). Over MQTT the topics are <span class='sm-mono'>&lt;base&gt;/Plugin/STATUS/…</span>. In Loxone a status block on <span class='sm-mono'>ok</span> plus a comparison on the age of the timestamp is enough. Set the threshold well above the polling interval so a single missed run does not raise an alarm."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every input by hand: this file creates the inputs with the correct names; the values then come from the MQTT gateway. <b>Note:</b> Loxone Config always creates new objects on import - importing twice yields duplicate blocks."
H_VORLAGE_TEXT2 = "The names come from the last Gardena response (device cache); only numeric values are included, text values are created by the gateway on first receive. Limits of unknown values are set wide and can be adjusted in Loxone Config."
K_VORLAGE = "Create template for Loxone Config"
K_VORLAGE_VO = "Create command template"
VORLAGE_KEIN_ABBILD = "No device cache yet – the template can only be created after the plugin has fetched successfully once (tab <i>Test</i>, fetch now)."

