MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
ZU_ZAHLEN = "On the numeric fields:"
ZU_ZAHLEN_TEXT = "Since 1.2.19 the plugin forms numeric fields with 1 or 0 per device from the texts of the GARDENA cloud: <span class='sm-mono'>COMMON/online</span> (rfLinkState ONLINE), <span class='sm-mono'>MOWER/maeht</span> (activity OK_CUTTING or OK_CUTTING_TIMER_OVERRIDDEN), <span class='sm-mono'>MOWER/station</span> (activity PARKED_… or OK_CHARGING), <span class='sm-mono'>VALVE/offen</span> (MANUAL_WATERING or SCHEDULED_WATERING), <span class='sm-mono'>POWER_SOCKET/an</span> (FOREVER_ON, TIME_LIMITED_ON or SCHEDULED_ON) and <span class='sm-mono'>stoerung</span> on robotic mower, valve and socket (state ERROR). Every other text gives 0 – an unknown message never wrongly says “mowing” or “on”. If the cloud delivers the text without a value, the numeric field goes out as 0 since 1.2.21 (up to 1.2.20 without a value); if the text is missing entirely, the numeric field is missing as well. They go out on both paths (MQTT retained like the states); the texts themselves still go out unchanged, in the sample as Virtual Text Inputs. The value lists come from the interface description of Husqvarna; they have not been measured on a system."
BEWAESSERUNG = "Watering ahead: the plugin <i>Bewässerung</i> can open and close a GARDENA valve by itself (Settings tab, “Interface for the irrigation plugin”, off by default). Then its zone in Loxone no longer belongs to the block “Bewässerung” as well, otherwise both water; the push buttons of the page “GARDENA smart system Ventil” remain for manual operation."
VORLAGE_UNBEKANNT = "This template does not exist (any more) – for the MQTT values use the name table on the tab Loxone integration, step 3."
M_S1 = "<b>Switch on MQTT.</b> MQTT is the path of the LoxBerry plugins sample project: the plugin sends its values to the LoxBerry MQTT gateway, which passes them on to the Miniserver, and the commands come back through the command bridge. MQTT is switched on by default (tab <i>MQTT</i>, “MQTT dispatch”). The UDP path and the HTTP commands remain for existing installations (collapsed below)."
M_S1_AUS = "<b>MQTT is switched off.</b> Set “MQTT dispatch” to “active” on the tab <i>MQTT</i> – otherwise nothing arrives this way, and the command bridge accepts nothing."
M_S2 = "<b>The MQTT gateway.</b> The topic group of this plugin:"
M_S2_V2 = "Gateway V2: under <i>Services → MQTT Gateway → Subscriptions</i> the group %s appears. Tick these data points:"
M_HAKEN_AUF = "Tick list: %d data points"
M_WEITERE = "Further topics without a tick (%d): texts and identifiers the sample pages do not need, and the age for existing installations"
M_NONCACHED = "No topic needs “Noncached” or “Reset after send”: all of them are states, readings or counters."
M_RECONNECT = "After a restart of the Miniserver: the states (including the numeric fields) are retained, zaehler and ok arrive within 5 minutes, the readings come with the central <span class='sm-mono'>reconnect</span> (sample project, page “LoxBerry MQTT-Gateway”) or with the full dispatch after 30 minutes at the latest."
M_V1_BEFEHLE = "Under gateway V1 the subscription also takes the command topics and acknowledgements; the gateway creates inputs <span class='sm-mono'>…_befehl_…</span> for them. No command in the sample project has such a name – no loop arises."
M_S3 = "<b>Create inputs.</b> Per value one <b>Virtual Input</b> (texts: <b>Virtual Text Input</b>), name exactly as in the table – the MQTT gateway delivers under this name. There is no template for values: the names are enough."
M_S3_LEER = "No device cache yet – the table shows only the heartbeat. After the first successful poll (tab <i>Test</i>) the names of all devices appear here."
M_S3_DIGITAL = "Do not tick “Use as digital input” – not even for online, maeht, station, offen, an and stoerung."
M_S3_FEHLWERT = "-1 or -999 means: not delivered by the cloud right now. The numeric fields send 0 without a value."
M_S3_RECHTE = "The LoxBerry user on the Miniserver needs rights on these inputs."
M_S3_MUSTER = "If you copy the pages from the sample project, you get the inputs with them – but the device name is part of the name: change the names to your own devices."
M_S3_PRAEFIX = "Changed the base topic on the tab <i>MQTT</i> or renamed a device in the GARDENA app? Then the names change."
M_KOPIEREN = "copy"
M_KOPIERT = "copied"
M_T_THEMA = "Topic"
M_T_NAME = "Name in Loxone"
M_T_GERAET = "Device"
M_T_BEDEUTUNG = "Meaning"
M_T_BEREICH = "Unit/range"
M_T_FEHLWERT = "not delivered"
M_T_ART = "Number/text"
M_T_MUSTER = "in the sample project"
M_ZAHL = "number"
M_TEXT = "text"
M_S4 = "<b>Commands.</b> Robotic mowers, valves and sockets are switched through the command bridge: Loxone sends to the UDP input of the MQTT gateway (shared output “LoxBerry MQTT-Gateway”), the plugin checks and executes as through the HTTP endpoint (the same limits and brakes). On the tab <i>MQTT</i> set both ticks: “Accept commands via MQTT” and “Switch devices via MQTT” – off by default. The value is the duration in minutes or the word of the choice."
M_S4_BEISPIEL = "No device cache yet – the table shows the example devices of the sample project."
M_S4_KENNUNG = "* Name in the command via the device ID: the device name gives the same part as a second device or is longer than 40 characters."
M_S4_ABRUF = "In addition, without the second tick: %s – poll now (at the earliest 60 s after the last run)."
M_S4_SPERRE = "Lock time robotic mower 10 s (catches a bounce, park → schedule → park within one minute remains possible), valve and socket 0 s (the plugin itself suppresses the same command with the same duration for 60 s). At most 30 commands per hour for all devices; “Plugin enabled: No” blocks as via HTTP."
M_S4_VERLUST = "The commands are not refreshed (every repetition costs a call to the GARDENA cloud). Under gateway V1 a command can get lost under load – the status blocks “Sperre (GARDENA)” and “Steckdose Teich (GARDENA)” show a divergence."
M_S4_NICHTS = "Under gateway V1 and V2 nothing needs to be entered or ticked for commands."
M_S4_KEINE = "The command list could not be read (bin/befehlsbruecke.php or bin/befehle_zuordnung.php is missing or broken) – see tab <i>Test</i>."
M_S4_VORLAGE = "The template creates an output of its own “Gardena MQTT-Befehle” (address /dev/udp/&lt;LoxBerry&gt;/&lt;UDP port&gt;), per device the commands of the table. If you use the sample project, take the commands on the shared output “LoxBerry MQTT-Gateway” instead (block lists below)."
M_S5 = "<b>Outage detection.</b> Value Validator on %1$s: Tmc 1500 s (the sign of life arrives every 5 minutes through the UDP input of the gateway, never retained; five signs of life without a new value), Min 0, Max 999, constant 1 at En and remove the tick at ‘En’ in the properties window. %2$s says whether fresh values are there (1 = last poll complete). No age in seconds from a time stamp: Loxone calculates in local time."
M_S7 = "<b>Cross-check.</b> Look at the value of %s in Loxone Config – it changes every 5 minutes. On the tab <i>Test</i> start the poll and compare the values with the inputs; the last acknowledgement of a command is shown there too."
H_HTTP = "Existing installations: UDP path and HTTP commands"
HTTP_ERKLAERUNG = "Up to 1.2.20 these were the paths of this plugin. They keep working unchanged: the UDP dispatch to the Miniserver (Settings tab) and the endpoint with token for the commands. Since 1.2.21 missing numeric values carry -1 or -999 over UDP too (numeric fields 0) – whoever checks for “= 0” will see these values from now on."
