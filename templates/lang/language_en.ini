BREMSEN = "Brakes against a flapping block: <b>?action=refresh</b> is accepted at the earliest 60 seconds after the last run (otherwise HTTP 429), <b>?action=command</b> at most 30 times per hour (otherwise HTTP 429). During a polling lock after HTTP 429 from Husqvarna both reject with HTTP 503 without sending anything. If “Plugin active” is set to No, both reject with HTTP 409. Commands to a device with several services of the same kind (several valves, say) are also rejected with HTTP 409 until it has been measured on real hardware how the cloud delivers such a device. Valve and socket commands (VALVE_CONTROL, POWER_SOCKET_CONTROL): the same command with the same duration to the same valve or socket within 60 seconds is not sent to the cloud again – the endpoint answers HTTP 200 with UNVERAENDERT=1, and the command does not count against the 30 per hour. Mower commands are sent every time. A virtual output does not evaluate the answer — if something seems odd, look at the Log files tab."
