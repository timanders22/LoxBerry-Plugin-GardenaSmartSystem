ZU_NAMEN_TEXT = "The names of the virtual inputs are not suggestions: the MQTT gateway creates the inputs under exactly this name (the topic with <span class='sm-mono'>_</span> instead of <span class='sm-mono'>/</span>). If you rename one, the next message creates a second input that is never wired. Set a readable display name as the description in Loxone Config. All other blocks may be named as you like. The complete topics of all devices are listed in the MQTT tab."
