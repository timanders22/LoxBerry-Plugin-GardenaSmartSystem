ZU_ZAHLEN = "On the numeric fields:"
ZU_ZAHLEN_TEXT = "Since 1.2.19 the plugin forms numeric fields with 1 or 0 per device from the texts of the GARDENA cloud: <span class='sm-mono'>COMMON/online</span> (rfLinkState ONLINE), <span class='sm-mono'>MOWER/maeht</span> (activity OK_CUTTING or OK_CUTTING_TIMER_OVERRIDDEN), <span class='sm-mono'>MOWER/station</span> (activity PARKED_… or OK_CHARGING), <span class='sm-mono'>VALVE/offen</span> (MANUAL_WATERING or SCHEDULED_WATERING), <span class='sm-mono'>POWER_SOCKET/an</span> (FOREVER_ON, TIME_LIMITED_ON or SCHEDULED_ON) and <span class='sm-mono'>stoerung</span> on robotic mower, valve and socket (state ERROR). Every other text gives 0 – an unknown message never wrongly says “mowing” or “on”. If the cloud delivers the text without a value, the numeric field goes out without a value too; if the text is missing entirely, the numeric field is missing as well. They go out on both paths (MQTT retained like the states) and are in the templates; the texts themselves still go out unchanged, in the sample as Virtual Text Inputs. The value lists come from the interface description of Husqvarna; they have not been measured on a system."
BEWAESSERUNG = "Watering ahead: the plugin <i>Bewässerung</i> can open and close a GARDENA valve by itself (Settings tab, “Interface for the irrigation plugin”, off by default). Then its zone in Loxone no longer belongs to the block “Bewässerung” as well, otherwise both water; the push buttons of the page “GARDENA smart system Ventil” remain for manual operation."

