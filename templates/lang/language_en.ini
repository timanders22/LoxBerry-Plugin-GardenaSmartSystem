[LOX]
K_VORLAGE_UDP = "Create template for the UDP path"
VORLAGE_ADRESSE = "The UDP template carries the presumed address of the LoxBerry. It is a suggestion — please check it in Loxone Config, the Miniserver must see the LoxBerry at exactly that address."
H_BAUSTEINE = "Step by step: the blocks"
BAUSTEINE_TEXT = "Four pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“GARDENA smart system”</b> shows whether the plugin is running and whether all devices have radio and battery (for everybody), <b>“… Mähroboter”</b>, <b>“… Ventil”</b> and <b>“… Sensor und Steckdose”</b> show and control one kind of device each – if you do not have a device, leave out its page. Per page: instructions, table (work through it from top to bottom), notes and picture. The names of the inputs and commands apply to your own devices (per kind the first one in the device cache) and the configured base topic; without a cache the example names of the sample project appear. Loxone Config finds the blocks via the block search (F5)."
S_BAUSTEIN = "Block (type)"
S_NAME = "Name"
S_PARAMETER = "Parameter"
S_EINGAENGE = "Connect inputs to"
S_EINGANG = "Input"
ZU_9 = "On the notifications:"
ZU_9_TEXT = "The notification block only fires on the transition from off to on. Never wire several sources straight to its input — merge them through OR first, otherwise a permanently active source swallows all the others."
ZU_ANSAGE = "Speech output:"
ZU_ANSAGE_TEXT = "The announcements (Settings tab) are triggered by the plugin's own poll, not by Loxone – no new block is needed for them."
H_LEERE_WERTE = "Values the cloud does not supply"
LEERE_WERTE = "If GARDENA reports an attribute <b>without</b> a value, a <b>-</b> goes out over MQTT (retained for states), nothing over UDP — the virtual UDP input keeps its last value. An <b>empty string</b> also goes out as <b>-</b> over MQTT; over UDP it is a value and is sent, the line then ends with the colon (<span class='sm-mono'>SERVICE.device.attribute:</span>) and a virtual input with command recognition reads <b>0</b> from it. If a device or an attribute drops out of the cloud's answer, its retained states read <b>-</b> afterwards. For an attribute that can become empty — an error code being cleared, say — use a text input or evaluate it over MQTT."
H_AUSFALL = "Failure detection"
AUSFALL = "If the cloud goes quiet, the virtual inputs keep their last value and everything looks normal in the app. The plugin therefore sends a heartbeat on <b>every</b> cron run, even after an abort and even when no poll happens because of the configured interval or a polling lock: <span class='sm-mono'>STATUS.Plugin.ok</span> (1 = last poll complete, 0 = abort or failed send attempts), <span class='sm-mono'>STATUS.Plugin.zeitstempel</span> (Loxone time of the last successful poll, 0 = never), <span class='sm-mono'>STATUS.Plugin.werte</span>, <span class='sm-mono'>STATUS.Plugin.fehler</span> in plain text (a hyphen means: no error), <span class='sm-mono'>STATUS.Plugin.ts</span> (Unix time of this run) and <span class='sm-mono'>STATUS.Plugin.zaehler</span> (advances on every run). Over MQTT the topics are <span class='sm-mono'>&lt;base&gt;/Plugin/STATUS/…</span> and are never retained. If <span class='sm-mono'>ts</span> stands still, the service is not running or the path to the Miniserver is broken; if <span class='sm-mono'>zeitstempel</span> stands still while <span class='sm-mono'>ts</span> advances, the service runs but gets nothing from the cloud. “Sent” means the LoxBerry sent the packet — it cannot know whether it arrived. For the Value Validator of the page “GARDENA smart system” <span class='sm-mono'>zaehler</span> is the sign of life: it changes with every cron run (every 5 minutes), even without a poll."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every input by hand: this file creates the inputs with the correct names; the values then come from the MQTT gateway. <b>Note:</b> Loxone Config always creates new objects on import - importing twice yields duplicate blocks."
H_VORLAGE_TEXT2 = "The names come from the last Gardena response (device cache); only numeric values are included, text values are created by the gateway on first receive. In addition each device gets the numeric fields online, maeht, station, offen, an and stoerung (since 1.2.19, 1 or 0 each). Limits of unknown values are set wide and can be adjusted in Loxone Config."
K_VORLAGE = "Create template for Loxone Config"
K_VORLAGE_VO = "Create command template"
VORLAGE_KEIN_ABBILD = "No device cache yet – the template can only be created after the plugin has fetched successfully once (tab <i>Test</i>, fetch now)."

