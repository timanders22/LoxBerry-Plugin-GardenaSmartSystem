[BAUSTEIN]
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
OHNE_ABBILD = "No device cache yet: the tables show the example names of the sample project (Maehroboter, Ventil Beet, Sensor Beet, Steckdose Teich). After the first successful poll the names of your own devices appear here."
FEHLT_ART = "The device cache has no device of this kind: %s. The rows for it apply as soon as one is added; until then they show the example names of the sample project."
ART_MOWER = "robotic mower"
ART_VALVE = "valve"
ART_SENSOR = "sensor"
ART_POWER_SOCKET = "socket"
S1_SCHRITT1 = "Create an application on developer.husqvarnagroup.cloud and connect the “GARDENA smart system API”. Enter application key and secret in the plugin tab “%s”, set “%s” to Yes, save. Tab “%s” → “%s”: afterwards the devices appear in the tab “%s”. Preferably give the devices names without umlauts and special characters (GARDENA app) – otherwise the names contain underscores."
S1_SCHRITT2 = "LoxBerry → MQTT gateway: enter the subscription “gardena/#” (gateway version 1; with version 2 tick the data points). If you chose another base topic in the tab “%s”, subscribe to that one."
S1_SCHRITT3 = "Tab “%s” → download “%s”. In Loxone Config select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”. Import only ONCE (twice gives duplicate inputs). The container is called “Gardena smart system”. After a new device fetch the template again and take over only the new inputs."
S1_SCHRITT4 = "Create the page “GARDENA smart system”, drag the 13 inputs of the table (no. 1–3, 12–15, 20, 21, 25–28) from the container, plus the constant 1 (no. 5, block search F5, value 1). Text input no. 4: create by hand (Periphery → Virtual Inputs → Virtual Text Input), name exactly like this, “Use in User Interface” on. Create three notifications (Periphery → Messages → Notification), texts as in the table; each gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the table, connect from top to bottom. On the Value Validator no. 6 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). AND no. 17: click the input point I2, afterwards the input shows a small circle (inverted). Text input no. 4 goes to V4 of the status “Zustand (GARDENA)”. Status “Geräte (GARDENA)”: click “+” four times first (V5–V8). Enter the rows of the status blocks in the given order, the one without condition last."
S1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (GARDENA)” shows “läuft – …”, “Geräte (GARDENA)” shows “alle 4 Geräte erreichbar”, and the sign of life no. 1 changes every 5 minutes."
S1_H1 = "The message only comes after 10 minutes of trouble. If the plugin says “%s: No”, it goes completely silent – that also reports “Plugin gestört” after about 15 minutes, and commands are then rejected."
S1_H2 = "Polling interval longer than 5 minutes (against the polling limit of Husqvarna): a single failed poll keeps “ok” at 0 for a whole interval and then reports after 10 minutes already – with 15 or 30 minutes set the 600 s in no. 9 to twice the interval."
S1_H3 = "Further devices: per device its inputs from the same template (name = device name) and another formula like no. 16 or 22 – never several sources directly to a notification."
S1_H4 = "Use only the MQTT path: if you take it, you can switch off the setting plugin tab “%s” → “%s”. The UDP template is equivalent but knows no texts – do not import both."
S1_H5 = "After “%s” renew the addresses in the container “Gardena steuern (LoxBerry-Plugin)” (the inputs need no token)."
S2_SCHRITT1 = "Tab “%s” → download “%s” and import it in Loxone Config in the tree “Virtual Outputs” → “Predefined devices → Import template…” (once). The container is called “Gardena steuern (LoxBerry-Plugin)”; the token is already in the address."
S2_SCHRITT2 = "Create the page “GARDENA smart system Mähroboter”, drag the 5 inputs (no. 1–5) from “Gardena smart system” and the 4 commands (no. 12, 15, 23, 25) from “Gardena steuern (LoxBerry-Plugin)”. Text inputs no. 6 and 7: create by hand (Periphery → Virtual Inputs → Virtual Text Input), name exactly like this, “Use in User Interface” on. Add “Regensensor (eigene Quelle)” from the tree (in your own project your own rain sensor)."
S2_SCHRITT3 = "Create four push buttons, the switch “Regensperre ein (GARDENA)” (off by default) and the remaining blocks via F5 and connect them from top to bottom. Status “Mähroboter (GARDENA)”: click “+” three times first (V5–V7); text inputs no. 6 and 7 go to V6 and V7."
S2_SCHRITT4 = "Save and transfer. Check: “Parken bis nächste Zeit” – the robotic mower drives into the station; the status shows it after one poll at the latest (5 min)."
S2_H1 = "A command only means “accepted by GARDENA”. Whether the robotic mower carries it out (rain, empty battery, fault) is only shown by the next poll."
S2_H2 = "At most 30 commands per hour for all GARDENA devices together; the rain lock sends two per rain."
S2_H3 = "The Edge Detection no. 21 sends “parken bis auf Widerruf” when the lock begins and “Zeitplan folgen” when it ends – each through an OR with the push button, because a command gets only one source."
S2_H4 = "“Mähen 1 Stunde” is fixed to 3600 s. For another duration change the command in the container (“seconds=…”, a multiple of 60, at most 86400)."
S3_SCHRITT1 = "Create the page “GARDENA smart system Ventil”, drag the 2 inputs (no. 1, 2) from “Gardena smart system” and the 4 commands (no. 5, 7, 12, 13) from “Gardena steuern (LoxBerry-Plugin)”. Text input no. 3: create by hand (Periphery → Virtual Inputs → Virtual Text Input), name exactly like this, “Use in User Interface” on. Add “Regensensor (eigene Quelle)” from the tree."
S3_SCHRITT2 = "Create two push buttons, the switch “Ventil-Zeitplan aussetzen (GARDENA)”, OR, Edge Detection, status, Switch-On Delay and notification and connect them; text input no. 3 goes to V4 of the status “Ventil Beet (GARDENA)”."
S3_SCHRITT3 = "Save and transfer. Check: “Beet 30 Minuten gießen” – the valve opens; “Ventil Beet (GARDENA)” shows “gießt” after one poll at the latest."
S3_H1 = "Safeguards in the plugin: at most 3 hours per open command (otherwise rejected, nothing goes out); every opening has a duration – the GARDENA cloud closes afterwards by itself. The same command within 60 seconds goes out only once."
S3_H2 = "30 minutes are fixed in the template. Another duration: change “seconds=1800” in the container (a multiple of 60, at most 10800)."
S3_H3 = "Devices with several valves (smart Irrigation Control) are locked for commands by the plugin until it has been measured how GARDENA reports them – the page applies to a water control with one valve."
S3_H4 = "Watering ahead: the plugin Bewässerung (pages “Bewässerung” and “Bewässerung Zonen”) can open and close this valve BY ITSELF – in the GARDENA plugin tab “%s” switch on the “%s” (off by default) and enter the valve token in Bewässerung, there in the tab Zones choose the output “GARDENA-Ventil” and “Ventil Beet” for “Beet”. Then the zone Beet NO longer belongs to the block “Bewässerung” (leave out V2, Tv2 and the feedback no. 41–43 there), otherwise both water; Bewässerung counts the GARDENA runs itself. The push buttons of this page remain for manual operation."
S3_H5 = "“Pause” only suspends the GARDENA schedule, not a running watering (use “stoppen” for that)."
S4_SCHRITT1 = "Create the page “GARDENA smart system Sensor und Steckdose”, drag the 6 inputs (no. 1–4, 12, 13) from “Gardena smart system” and the 3 commands (no. 17, 18, 20) from “Gardena steuern (LoxBerry-Plugin)”. Text input no. 14: create by hand (Periphery → Virtual Inputs → Virtual Text Input), name exactly like this, “Use in User Interface” on. Switch on “Statistics” at the soil moisture (no. 1) and the air temperature (no. 3)."
S4_SCHRITT2 = "Create formulas, delays, notifications, switch, push button, Edge Detection and status blocks and connect them. Status “Sensor Beet (GARDENA)”: click “+” twice first (V5, V6). Text input no. 14 goes to V4 of the status “Steckdose Teich (GARDENA)”."
S4_SCHRITT3 = "Save and transfer. Check: switch “Teichpumpe ein (GARDENA)” – the socket switches; “Steckdose Teich (GARDENA)” shows “an” after one poll at the latest."
S4_H1 = "Adapt the thresholds 20 percent soil moisture and 2 °C frost in the formulas to garden and plants."
S4_H2 = "The switch only sends when it is switched. If the GARDENA app or a schedule switches the socket off, the status says so."
S4_H3 = "“Teichpumpe 1 Stunde” and the switch control the same socket – if you use the push button, leave the switch off."
Z1_01 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Plugin_STATUS_zaehler | Sign of life: minute of the plugin run, 0 to 999, wraps around; changes with every run (every 5 min), even if no poll happens because of the polling interval or a polling lock; arrives via the MQTT gateway (title = gateway name) | —"
Z1_02 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Plugin_STATUS_ok | 1 = the last poll at GARDENA was complete and all values went out; 0 = failed (login, polling lock, cloud does not answer) | —"
Z1_03 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Plugin_STATUS_werte | number of values the last complete dispatch sent out | —"
Z1_04 = "Virtual Text Input | gardena_Plugin_STATUS_fehler | create by hand, name exactly like this (the name the MQTT gateway assigns), “Use in User Interface” on; reason of the last failure in plain text, “-” = no error | —"
Z1_05 = "Constant | Konstante 1 | value 1 | —"
Z1_06 = "Value Validator | Lebenszeichen fehlt (GARDENA) | Tmc 900 s (three signs of life of 300 s each without a new value), Min 0, Max 999 – if the LoxBerry, the MQTT gateway or the poll stops, or the plugin says “Plugin enabled: No”, the sign of life stands still; remove the tick at ‘En’ in the properties window | V = #1, En = #5"
Z1_07 = "NOT | Keine frischen Daten (GARDENA) | — (the last poll at GARDENA failed) | I = #2"
Z1_08 = "OR | Störung (GARDENA) | — (no fresh data or sign of life missing) | I1 = #7, I2 = output E of #6"
Z1_09 = "Switch-On Delay | Störung bestätigt (GARDENA) | 600 s (two signs of life of 300 s each, with a polling interval of 5 min also two polls; a single failed poll and a restart report nothing) | Input = #8"
Z1_10 = "Notification | Meldung Plugin gestört (GARDENA) | Text: GARDENA smart system – no fresh values for more than 10 minutes: the poll at GARDENA fails (credentials, polling lock after too many polls, cloud disturbed) or the plugin does not report (LoxBerry, MQTT gateway, “Plugin enabled: No” in the plugin). Values in the app are then old, commands have no effect. Read the status “Zustand (GARDENA)” in the app | Input = #9"
Z1_11 = "Status | Zustand (GARDENA) | rows: V1 = 1 “the plugin has not reported for at least 15 minutes – check the LoxBerry, the MQTT gateway (subscription gardena/#) and ‘Plugin enabled: Yes’ in the plugin; tab Test”; V2 = 0 “the last poll at GARDENA failed: <v4> – check the credentials in the plugin tab Settings, a polling lock is shown in the tab Test”; without condition “running – last poll complete, <v3> values delivered”; visualisation ON | V1 = output E of #6, V2 = #2, V3 = #3, V4 = #4"
Z1_12 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_COMMON_online | 1 = the robotic mower has a radio link to the GARDENA gateway, 0 = none or unknown (new field; in your own project with your own device name) | —"
Z1_13 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Ventil_Beet_COMMON_online | 1 = the valve has a radio link, 0 = none or unknown | —"
Z1_14 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Sensor_Beet_COMMON_online | 1 = the sensor has a radio link, 0 = none or unknown | —"
Z1_15 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Steckdose_Teich_COMMON_online | 1 = the socket has a radio link, 0 = none or unknown | —"
Z1_16 = "Formula | Geräte nicht erreichbar (GARDENA) | (1-I1)+(1-I2)+(1-I3)+(1-I4) – number of devices without radio link (0 to 4); a fifth device via a second formula, add both | I1 = #12, I2 = #13, I3 = #14, I4 = #15"
Z1_17 = "AND | Gerät nicht erreichbar, Plugin läuft (GARDENA) | — (I2 inverted: click the input point in Config, a small circle appears) only while the plugin is running – an outage already reports “Meldung Plugin gestört (GARDENA)” | I1 = #16, I2 = #8 (inverted)"
Z1_18 = "Switch-On Delay | Gerät nicht erreichbar bestätigt (GARDENA) | 1800 s (six polls of 5 min each; short radio gaps report nothing) | Input = #17"
Z1_19 = "Notification | Meldung Gerät nicht erreichbar (GARDENA) | Text: GARDENA smart system – at least one device has had no radio link to the GARDENA gateway for 30 minutes. Check battery, distance to the gateway and power at the gateway; which device is shown by the status “Geräte (GARDENA)” and the GARDENA app | Input = #18"
Z1_20 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Ventil_Beet_COMMON_batteryLevel | battery of the valve in %% | —"
Z1_21 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Sensor_Beet_COMMON_batteryLevel | battery of the sensor in %% | —"
Z1_22 = "Formula | Batterie schwach (GARDENA) | IF(I1>0;IF(I1<20;1;0);0)+IF(I2>0;IF(I2<20;1;0);0) – number of devices below 20 percent; 0 (never reported) does not count; the robotic mower charges itself and is left out here | I1 = #20, I2 = #21"
Z1_23 = "Switch-On Delay | Batterie schwach bestätigt (GARDENA) | 600 s | Input = #22"
Z1_24 = "Notification | Meldung Batterie schwach (GARDENA) | Text: GARDENA smart system – the battery of the valve or the sensor is below 20 percent. Replace the batteries, otherwise the device will fail soon; which one is shown by the status “Geräte (GARDENA)” | Input = #23"
Z1_25 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_COMMON_rfLinkLevel | radio signal of the robotic mower in %% | —"
Z1_26 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Ventil_Beet_COMMON_rfLinkLevel | radio signal of the valve in %% | —"
Z1_27 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Sensor_Beet_COMMON_rfLinkLevel | radio signal of the sensor in %% | —"
Z1_28 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Steckdose_Teich_COMMON_rfLinkLevel | radio signal of the socket in %% | —"
Z1_29 = "Status | Geräte (GARDENA) | rows: V1 > 0 “<v1> device(s) without radio link – check the GARDENA gateway (power, network) and the distance; radio: mower <v2> %%, valve <v3> %%, sensor <v4> %%, socket <v5> %%”; V8 > 0 “battery low – valve <v6> %%, sensor <v7> %%; replace the batteries”; without condition “all 4 devices reachable – radio: mower <v2> %%, valve <v3> %%, sensor <v4> %%, socket <v5> %%; battery valve <v6> %%, sensor <v7> %%”; visualisation ON | V1 = #16, V2 = #25, V3 = #26, V4 = #27, V5 = #28, V6 = #20, V7 = #21, V8 = #22"
Z2_01 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_MOWER_maeht | 1 = the robotic mower is mowing right now (by schedule or on command), otherwise 0 (new field) | —"
Z2_02 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_MOWER_station | 1 = in the charging station (parked or charging), otherwise 0 (new field) | —"
Z2_03 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_MOWER_stoerung | 1 = the robotic mower reports an error (e.g. lifted, stuck, outside the boundary wire), otherwise 0 (new field) | —"
Z2_04 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_COMMON_batteryLevel | battery of the robotic mower in %% | —"
Z2_05 = "Virtual HTTP Input Command (template “Gardena smart system”) | gardena_Maehroboter_MOWER_operatingHours | total operating hours in h | —"
Z2_06 = "Virtual Text Input | gardena_Maehroboter_MOWER_activity | create by hand, name exactly like this (the name the MQTT gateway assigns), “Use in User Interface” on; what the robotic mower is doing right now, in the wording of the GARDENA cloud, e.g. OK_CUTTING, OK_SEARCHING, PARKED_TIMER | —"
Z2_07 = "Virtual Text Input | gardena_Maehroboter_MOWER_lastErrorCode | create by hand, name exactly like this, “Use in User Interface” on; last error code in the wording of the cloud | —"
Z2_08 = "Status | Mähroboter (GARDENA) | rows: V3 = 1 “fault – error code <v7>; look at the robotic mower, GARDENA app”; V1 = 1 “mowing – battery <v4> %%”; V2 = 1 “in the charging station – battery <v4> %%, <v5> operating hours”; without condition “on the way (<v6>) – battery <v4> %%”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7"
Z2_09 = "Switch-On Delay | Mähroboter-Störung bestätigt (GARDENA) | 600 s (two polls of 5 min each) | Input = #3"
Z2_10 = "Notification | Meldung Mähroboter gestört (GARDENA) | Text: GARDENA smart system – the robotic mower has been reporting a fault for 10 minutes (lifted, stuck, boundary wire). Look at the robotic mower; the error code is shown by the status “Mähroboter (GARDENA)” | Input = #9"
Z2_11 = "Virtual Input (Push Button) | Mähen 1 Stunde (GARDENA) | in the app; mows for one hour, also outside the schedule | —"
Z2_12 = "Virtual Output Command (template “Gardena steuern (LoxBerry-Plugin)”) | Maehroboter mähen (1 h) | command on ON: mow for one hour, regardless of the schedule | Input = #11"
Z2_13 = "Virtual Input (Push Button) | Zeitplan folgen (GARDENA) | in the app; the robotic mower mows again according to its schedule in the GARDENA app | —"
Z2_14 = "Virtual Input (Push Button) | Parken bis nächste Zeit (GARDENA) | in the app; drives into the station and mows again at the next schedule slot | —"
Z2_15 = "Virtual Output Command (template “Gardena steuern (LoxBerry-Plugin)”) | Maehroboter parken bis nächste Zeit | command on ON: into the station until the next schedule slot | Input = #14"
Z2_16 = "Virtual Input (Push Button) | Parken bis auf Widerruf (GARDENA) | in the app; stays in the station until “Zeitplan folgen” or “Mähen 1 Stunde” comes | —"
Z2_17 = "Virtual Input (Switch) | Regensensor (eigene Quelle) | 1 = it is raining (further instance, the same placeholder as on “Robonect Steuerung”); in your own project connect your own rain sensor to no. 18 instead of this switch | —"
Z2_18 = "Switch-Off Delay | Rasen nass (GARDENA) | 7200 s (2 h drying time after the rain) | Input = #17"
Z2_19 = "Virtual Input (Switch) | Regensperre ein (GARDENA) | in the app; off by default; ON = into the station when it rains and for 2 h afterwards, then back to the schedule; switch off in winter | —"
