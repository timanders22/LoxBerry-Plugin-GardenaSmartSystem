H_LEERE_WERTE = "Werte, die die Wolke nicht liefert"
LEERE_WERTE = "Liefert GARDENA ein Zahlenattribut <b>ohne</b> Wert, geht seit 1.2.21 über MQTT <b>und</b> über UDP ein Fehlwert hinaus: <b>-1</b> bei Batterie, Funk, Bodenfeuchte, Helligkeit und Betriebsstunden, <b>-999</b> bei Boden- und Lufttemperatur (-1 °C ist ein echter Wert), <b>0</b> bei den Zahlenfeldern online, maeht, station, offen, an und stoerung (sie heißen „1 bei bekanntem Wert, sonst 0“). Texte und unbekannte Attribute gehen über MQTT als <b>-</b> hinaus, über UDP nichts. Bis 1.2.20 kam über MQTT „-“, das ein Analogeingang als 0 las („Akku 0 %“), und über UDP gar nichts. Eine <b>leere Zeichenkette</b> geht über MQTT als <b>-</b> hinaus; über UDP ist sie ein Wert, die Zeile endet dann auf den Doppelpunkt, und ein Virtueller Eingang mit Befehlserkennung liest daraus <b>0</b>. Fällt ein Gerät oder ein Attribut aus der Antwort der Wolke heraus, stehen seine zurückbehaltenen Zustände danach auf dem Fehlwert bzw. auf <b>-</b>. Wer in einer bestehenden Anlage auf „= 0“ prüft, sieht künftig -1 bzw. -999."
H_AUSFALL = "Das Lebenszeichen im Einzelnen"
AUSFALL = "Schweigt die Wolke, behalten die Eingänge ihren letzten Wert — in der App sieht dann alles normal aus. Das Plugin sendet deshalb bei <b>jedem</b> Cron-Lauf ein Lebenszeichen, auch nach einem Abbruch und auch dann, wenn wegen des eingestellten Abstands oder einer Abrufsperre gar nicht abgerufen wird: <span class='sm-mono'>&lt;Basis&gt;/Plugin/STATUS/ok</span> (1 = letzter Abruf vollständig, 0 = Abbruch oder gescheiterte Sendeversuche), <span class='sm-mono'>…/zaehler</span> (wandert bei jedem Durchgang), <span class='sm-mono'>…/werte</span>, <span class='sm-mono'>…/fehler</span> im Klartext (ein Bindestrich bedeutet: kein Fehler), dazu <span class='sm-mono'>…/zeitstempel</span> und <span class='sm-mono'>…/ts</span> für bestehende Anlagen; über UDP <span class='sm-mono'>STATUS.Plugin.&lt;name&gt;</span>. Nie retained. Für die Analogwertvalidierung ist <span class='sm-mono'>zaehler</span> das Lebenszeichen (Schritt 5) – kein Alter aus einem Zeitstempel rechnen: Loxone rechnet in Ortszeit. „Abgeschickt“ heißt: der LoxBerry hat das Paket losgeschickt — ob es ankam, kann er nicht wissen."
H_VORLAGE = "Vorlagen für bestehende Anlagen"
H_VORLAGE_TEXT = "Die UDP-Vorlage legt die Eingänge des UDP-Wegs an, die Steuervorlage die HTTP-Befehle mit Token. <b>Achtung:</b> Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine."
H_VORLAGE_TEXT2 = "Die Namen stammen aus der letzten Gardena-Antwort (Geräte-Zwischenspeicher); enthalten sind nur Zahlenwerte samt den Zahlenfeldern online, maeht, station, offen, an und stoerung. Die Grenzen nehmen die Fehlwerte an (MinVal -1 bzw. -999). Die frühere Vorlage für die MQTT-Eingänge (Virtueller HTTP-Eingang mit http://localhost) gibt es seit 1.2.21 nicht mehr – wer sie eingelesen hat, behält seine Eingänge; die Namen sind dieselben wie in der Namenstabelle."
K_VORLAGE_VO = "Vorlage der Steuerbefehle erzeugen"
VORLAGE_KEIN_ABBILD = "Noch kein Geräte-Abbild vorhanden – die Vorlage lässt sich erst erzeugen, wenn das Plugin einmal erfolgreich abgerufen hat (Reiter <i>Test</i>, Abruf jetzt)."

