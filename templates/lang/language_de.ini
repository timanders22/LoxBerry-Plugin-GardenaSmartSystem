M_T_MUSTER = "im Musterprojekt"
M_ZAHL = "Zahl"
M_TEXT = "Text"
M_S4 = "<b>Befehle.</b> Mähroboter, Ventile und Steckdosen werden über die Befehlsbrücke geschaltet: Loxone sendet an den UDP-Eingang des MQTT-Gateways (gemeinsamer Ausgang „LoxBerry MQTT-Gateway“), das Plugin prüft und führt aus wie über den HTTP-Endpunkt (dieselben Grenzen und Bremsen). Im Reiter <i>MQTT</i> beide Haken setzen: „Befehle über MQTT annehmen“ und „Geräte über MQTT schalten“ – ab Werk aus. Der Wert ist die Dauer in Minuten bzw. das Wort der Auswahl."
M_S4_BEISPIEL = "Noch kein Geräte-Abbild – die Tabelle zeigt die Beispielgeräte des Musterprojekts."
M_S4_KENNUNG = "* Name im Befehl über die Gerätekennung: der Gerätename ergibt denselben Teil wie ein zweites Gerät oder ist länger als 40 Zeichen."
M_S4_ABRUF = "Dazu ohne zweiten Haken: %s – Sofortabruf (frühestens 60 s nach dem letzten Lauf)."
M_S4_SPERRE = "Sperrzeit Mähroboter 10 s (fängt ein Prellen ab, parken → Zeitplan → parken binnen einer Minute bleibt möglich), Ventil und Steckdose 0 s (das Plugin unterdrückt denselben Befehl mit derselben Dauer 60 s lang selbst). Höchstens 30 Befehle je Stunde für alle Geräte; „Plugin aktiv: Nein“ sperrt wie über HTTP."
M_S4_VERLUST = "Die Befehle werden nicht aufgefrischt (jede Wiederholung kostet einen Aufruf der GARDENA-Wolke). Unter Gateway V1 kann bei Last ein Befehl verloren gehen – die Status „Sperre (GARDENA)“ und „Steckdose Teich (GARDENA)“ zeigen ein Auseinanderlaufen."
M_S4_NICHTS = "Unter Gateway V1 und V2 ist für Befehle nichts einzutragen oder anzuhaken."
M_S4_KEINE = "Die Befehlsliste ließ sich nicht lesen (bin/befehlsbruecke.php oder bin/befehle_zuordnung.php fehlt oder ist defekt) – siehe Reiter <i>Test</i>."
M_S4_VORLAGE = "Die Vorlage legt einen eigenen Ausgang „Gardena MQTT-Befehle“ an (Adresse /dev/udp/&lt;LoxBerry&gt;/&lt;UDP-Anschluss&gt;), je Gerät die Befehle der Tabelle. Wer das Musterprojekt nutzt, nimmt statt dessen die Befehle am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Baustein-Listen unten)."
M_S5 = "<b>Ausfallerkennung.</b> Analogwertvalidierung an %1$s: Tmc 1500 s (das Lebenszeichen kommt alle 5 Minuten über den UDP-Eingang des Gateways, nie zurückbehalten; fünf Lebenszeichen ohne neuen Wert), Min 0, Max 999, Konstante 1 an En und im Eigenschaftsfenster den Haken bei ‚En‘ entfernen. %2$s sagt, ob frische Werte da sind (1 = letzter Abruf vollständig). Kein Alter in Sekunden aus einem Zeitstempel: Loxone rechnet in Ortszeit."
M_S7 = "<b>Gegenprobe.</b> In Loxone Config den Wert von %s ansehen – er ändert sich alle 5 Minuten. Im Reiter <i>Test</i> den Abruf starten und die Werte mit den Eingängen vergleichen; dort steht auch die letzte Quittung eines Befehls."
H_HTTP = "Bestehende Anlagen: UDP-Weg und HTTP-Befehle"
HTTP_ERKLAERUNG = "Bis 1.2.20 waren das die Wege dieses Plugins. Sie wirken unverändert weiter: der UDP-Versand an den Miniserver (Reiter Einstellungen) und der Endpunkt mit Token für die Befehle. Seit 1.2.21 tragen fehlende Zahlenwerte auch über UDP -1 bzw. -999 (Zahlenfelder 0) – wer auf „= 0“ prüft, sieht künftig diese Werte."
