ART_POWER_SOCKET = "Steckdose"
S1_SCHRITT1 = "Auf developer.husqvarnagroup.cloud eine Application anlegen und die „GARDENA smart system API“ verbinden. Application Key und Secret im Plugin Reiter „%s“ eintragen, „%s“ auf Ja stellen, speichern. Reiter „%s“ → „%s“: danach stehen die Geräte im Reiter „%s“. Gerätenamen am besten ohne Umlaute und Sonderzeichen vergeben (GARDENA-App) – sonst stehen im Namen Unterstriche."
S1_SCHRITT2 = "LoxBerry → MQTT-Gateway: unter Gateway-Fassung 1 trägt das Plugin das Abo „gardena/#“ selbst ein (Datei mqtt_subscriptions.cfg); unter Fassung 2 die Datenpunkte der Hakenliste anhaken (Reiter „%s“, Schritt 2). Wer im Reiter MQTT ein anderes Basisthema gewählt hat, bekommt dessen Abo und Namen."
S1_SCHRITT3 = "Die 13 Eingänge der Tabelle (Nr. 1–3, 12–15, 20, 21, 25–28) als Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Name genau wie in der Namenstabelle (Reiter „%s“, Schritt 3, Knopf „kopieren“); „Als Digitaleingang verwenden“ nicht anhaken. Wer die Seite aus dem Musterprojekt kopiert, bekommt die Eingänge mit und stellt nur die Namen auf die eigenen Geräte um."
S1_SCHRITT4 = "Seite „GARDENA smart system“ anlegen, die 13 Eingänge dazu, dazu die Konstante 1 (Nr. 5, Baustein-Suche F5, Wert 1). Den Texteingang Nr. 4 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so, „In Visualisierung verwenden“ an. Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung), Texte wie in der Tabelle; jede bekommt genau eine Leitung."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. An der Analogwertvalidierung Nr. 6 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 17: auf den Eingangspunkt I2 klicken, danach zeigt der Eingang einen kleinen Kreis (negiert). Der Texteingang Nr. 4 kommt an V4 des Status „Zustand (GARDENA)“. Status „Geräte (GARDENA)“: vorher viermal „+“ klicken (V5–V8). Die Zeilen der Status in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
S1_SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (GARDENA)“ zeigt „läuft – …“, „Geräte (GARDENA)“ zeigt „alle 4 Geräte erreichbar“, und das Lebenszeichen Nr. 1 ändert sich alle 5 Minuten."
S1_H1 = "Die Meldung kommt erst nach 10 Minuten Störung. Steht im Plugin „%s: Nein“, schweigt das Plugin ganz – auch das meldet nach etwa 35 Minuten „Plugin gestört“ (Validierung 1500 s, dann 600 s Verzögerung), und Befehle werden dann abgewiesen."
S1_H2 = "Abrufabstand größer als 5 Minuten (gegen die Abrufgrenze von Husqvarna): ein einzelner gescheiterter Abruf hält „ok“ einen ganzen Abstand lang auf 0 und meldet dann schon nach 10 Minuten – bei 15 oder 30 Minuten die 600 s in Nr. 9 auf das Doppelte des Abstands setzen."
S1_H3 = "Weitere Geräte: je Gerät seine Eingänge nach der Namenstabelle (der Gerätename steckt im Namen) und eine weitere Formel wie Nr. 16 bzw. 22 – nie mehrere Quellen direkt an eine Benachrichtigung."
S1_H4 = "Der UDP-Weg bleibt nur für bestehende Anlagen (Reiter Einbindung, zugeklappt unten). Wer nur MQTT nutzt, kann im Plugin Reiter „%s“ den „%s“ ausschalten; nicht beide Wege einlesen."
S1_H5 = "Die Befehle auf den übrigen Seiten wirken nur mit den Haken „Befehle über MQTT annehmen“ und „Geräte über MQTT schalten“ (Reiter „%s“, beide ab Werk aus); ein Token brauchen sie nicht."
S2_SCHRITT1 = "Im Plugin Reiter „%s“ die Haken „Befehle über MQTT annehmen“ und „Geräte über MQTT schalten“ setzen. Die 4 Befehle (Nr. 12, 15, 23, 25) am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ anlegen (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt), Befehl bei EIN genau wie in der Tabelle; im eigenen Projekt mit dem eigenen Gerätenamen (Reiter „%s“, Schritt 4, Spalte „Name im Befehl“)."
S2_SCHRITT2 = "Seite „GARDENA smart system Mähroboter“ anlegen, die 5 Eingänge (Nr. 1–5) und die 4 Befehle (Nr. 12, 15, 23, 25) dazu. Die Texteingänge Nr. 6 und 7 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so, „In Visualisierung verwenden“ an. „Regensensor (eigene Quelle)“ aus dem Baum dazu (im eigenen Projekt der eigene Regensensor)."
S2_SCHRITT3 = "Vier Tasten, den Schalter „Regensperre ein (GARDENA)“ (ab Werk aus) und die übrigen Bausteine über F5 anlegen und von oben nach unten verbinden. Status „Mähroboter (GARDENA)“: vorher dreimal „+“ klicken (V5–V7); die Texteingänge Nr. 6 und 7 kommen an V6 und V7."
S2_SCHRITT4 = "Speichern und übertragen. Probe: „Parken bis nächste Zeit“ – der Mähroboter fährt in die Station; der Status zeigt es nach spätestens einem Abruf (5 min)."
S2_H1 = "Ein Befehl heißt nur „von GARDENA angenommen“. Ob der Mähroboter ihn ausführt (Regen, leerer Akku, Fehler), zeigt erst der nächste Abruf."
S2_H2 = "Höchstens 30 Befehle je Stunde für alle GARDENA-Geräte zusammen; die Regensperre schickt je Regen zwei."
S2_H3 = "Die Flankenerkennung Nr. 21 schickt beim Beginn der Sperre „parken bis auf Widerruf“ und an ihrem Ende „Zeitplan folgen“ – je über ein ODER mit der Taste, denn ein Befehl bekommt nur eine Quelle."
S2_H4 = "„Mähen 1 Stunde“ sendet 60 (Minuten). Wer eine andere Dauer will, ändert die Zahl hinter „maehen“ im Befehl (Minuten, höchstens 1440)."
S3_SCHRITT1 = "Seite „GARDENA smart system Ventil“ anlegen, die 2 Eingänge (Nr. 1, 2) und die 4 Befehle (Nr. 5, 7, 12, 13) am Ausgang „LoxBerry MQTT-Gateway“ dazu (wie Seite Mähroboter, Schritt 1). Den Texteingang Nr. 3 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so, „In Visualisierung verwenden“ an. „Regensensor (eigene Quelle)“ aus dem Baum dazu."
S3_SCHRITT2 = "Zwei Tasten, den Schalter „Ventil-Zeitplan aussetzen (GARDENA)“, ODER, Flankenerkennung, Status, Einschaltverzögerung und Benachrichtigung anlegen und verbinden; der Texteingang Nr. 3 kommt an V4 des Status „Ventil Beet (GARDENA)“."
S3_SCHRITT3 = "Speichern und übertragen. Probe: „Beet 30 Minuten gießen“ – das Ventil öffnet; „Ventil Beet (GARDENA)“ zeigt „gießt“ nach spätestens einem Abruf."
S3_H1 = "Absicherungen im Plugin: höchstens 3 Stunden je Öffnen-Befehl (sonst abgewiesen, nichts geht hinaus); jedes Öffnen hat eine Dauer – die GARDENA-Wolke schließt danach selbst. Derselbe Befehl binnen 60 Sekunden geht nur einmal hinaus."
S3_H2 = "30 Minuten stehen im Befehl. Andere Dauer: die Zahl hinter „bewaessern“ ändern (Minuten, höchstens 180)."
S3_H3 = "Geräte mit mehreren Ventilen (smart Irrigation Control) sperrt das Plugin für Befehle, bis gemessen ist, wie GARDENA sie meldet – die Seite gilt für einen Bewässerungscomputer mit einem Ventil."
S3_H4 = "Vorausschauend gießen: das Plugin Bewässerung (Seiten „Bewässerung“ und „Bewässerung Zonen“) kann dieses Ventil SELBST öffnen und schließen – im Plugin GARDENA Reiter „%s“ die „%s“ einschalten (ab Werk aus) und das Ventil-Token in die Bewässerung eintragen, dort im Reiter Zonen bei „Beet“ die Ausgabe „GARDENA-Ventil“ und „Ventil Beet“ wählen. Dann gehört die Zone Beet NICHT mehr an den Baustein „Bewässerung“ (V2, Tv2 und die Rückmeldung Nr. 41–43 dort weglassen), sonst gießen beide; die Bewässerung zählt die GARDENA-Läufe selbst. Die Tasten dieser Seite bleiben für den Handbetrieb."
S3_H5 = "„Zeitplan aussetzen“ setzt nur den GARDENA-Zeitplan aus, ein laufendes Gießen nicht (dafür „stoppen“)."
S4_SCHRITT1 = "Seite „GARDENA smart system Sensor und Steckdose“ anlegen, die 6 Eingänge (Nr. 1–4, 12, 13) und die 3 Befehle (Nr. 17, 18, 20) am Ausgang „LoxBerry MQTT-Gateway“ dazu. Den Texteingang Nr. 14 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Name genau so, „In Visualisierung verwenden“ an. „Statistik“ an der Bodenfeuchte (Nr. 1) und der Lufttemperatur (Nr. 3) einschalten."
S4_SCHRITT2 = "Formeln, Verzögerungen, Benachrichtigungen, Schalter, Taste, Flankenerkennung und Status anlegen und verbinden. Status „Sensor Beet (GARDENA)“: vorher zweimal „+“ klicken (V5, V6). Der Texteingang Nr. 14 kommt an V4 des Status „Steckdose Teich (GARDENA)“."
S4_SCHRITT3 = "Speichern und übertragen. Probe: Schalter „Teichpumpe ein (GARDENA)“ – die Steckdose schaltet; „Steckdose Teich (GARDENA)“ zeigt „an“ nach spätestens einem Abruf."
S4_H1 = "Die Schwellen 20 Prozent Bodenfeuchte und 2 °C Frost in den Formeln an Garten und Pflanzen anpassen."
S4_H2 = "Der Schalter sendet nur beim Umschalten. Schaltet die GARDENA-App oder ein Zeitplan die Steckdose aus, sagt es der Status."
S4_H3 = "„Teichpumpe 1 Stunde“ und der Schalter steuern dieselbe Steckdose – wer die Taste nimmt, lässt den Schalter aus."
Z1_01 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin GARDENA smart system) | gardena_Plugin_STATUS_zaehler | Lebenszeichen: Minute des Plugin-Laufs, 0 bis 999, läuft um; ändert sich bei jedem Lauf (alle 5 min), auch wenn wegen des Abrufabstands oder einer Abrufsperre nicht abgerufen wird (nie retained) | —"
Z1_02 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin GARDENA smart system) | gardena_Plugin_STATUS_ok | 1 = der letzte Abruf bei GARDENA war vollständig und alle Werte sind hinausgegangen; 0 = gescheitert (Anmeldung, Abrufsperre, Wolke antwortet nicht); kommt bei jedem Lauf (nie retained) | —"
Z1_03 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin GARDENA smart system) | gardena_Plugin_STATUS_werte | Zahl der Werte, die der letzte vollständige Versand hinausgeschickt hat | —"
