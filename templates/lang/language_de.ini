MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
ZU_ZAHLEN = "Zu den Zahlenfeldern:"
ZU_ZAHLEN_TEXT = "Seit 1.2.19 bildet das Plugin aus den Texten der GARDENA-Wolke je Gerät Zahlenfelder mit 1 oder 0: <span class='sm-mono'>COMMON/online</span> (rfLinkState ONLINE), <span class='sm-mono'>MOWER/maeht</span> (activity OK_CUTTING oder OK_CUTTING_TIMER_OVERRIDDEN), <span class='sm-mono'>MOWER/station</span> (activity PARKED_… oder OK_CHARGING), <span class='sm-mono'>VALVE/offen</span> (MANUAL_WATERING oder SCHEDULED_WATERING), <span class='sm-mono'>POWER_SOCKET/an</span> (FOREVER_ON, TIME_LIMITED_ON oder SCHEDULED_ON) und <span class='sm-mono'>stoerung</span> an Mähroboter, Ventil und Steckdose (state ERROR). Jeder andere Text ergibt 0 – eine unbekannte Meldung sagt nie fälschlich „mäht“ oder „an“. Liefert die Wolke den Text ohne Wert, geht das Zahlenfeld seit 1.2.21 als 0 hinaus (bis 1.2.20 ohne Wert); fehlt der Text ganz, fehlt auch das Zahlenfeld. Sie gehen auf beiden Wegen hinaus (MQTT wie die Zustände zurückbehalten); die Texte selbst gehen unverändert weiter hinaus, im Muster als Virtuelle Texteingänge. Die Wertelisten stammen aus der Schnittstellenbeschreibung von Husqvarna, an einer Anlage gemessen sind sie nicht."
BEWAESSERUNG = "Vorausschauend gießen: das Plugin <i>Bewässerung</i> kann ein GARDENA-Ventil selbst öffnen und schließen (Reiter Einstellungen, „Schnittstelle für die Bewässerung“, ab Werk aus). Dann gehört dessen Zone in Loxone nicht mehr zusätzlich an den Baustein „Bewässerung“, sonst gießen beide; die Tasten der Seite „GARDENA smart system Ventil“ bleiben für den Handbetrieb."
VORLAGE_UNBEKANNT = "Diese Vorlage gibt es nicht (mehr) – für die MQTT-Werte steht die Namenstabelle im Reiter Einbindung in Loxone, Schritt 3."
M_S1 = "<b>MQTT einschalten.</b> MQTT ist der Weg des LoxBerry-Plugins Musterprojekts: das Plugin sendet seine Werte an das MQTT-Gateway von LoxBerry, das sie an den Miniserver weitergibt, und die Befehle kommen über die Befehlsbrücke zurück. Ab Werk ist MQTT eingeschaltet (Reiter <i>MQTT</i>, „MQTT-Versand“). Der UDP-Weg und die HTTP-Befehle bleiben für bestehende Anlagen (zugeklappt unten)."
M_S1_AUS = "<b>MQTT ist ausgeschaltet.</b> Im Reiter <i>MQTT</i> „MQTT-Versand“ auf „Aktiv“ stellen – sonst kommt auf diesem Weg nichts an, und die Befehlsbrücke nimmt nichts an."
M_S2 = "<b>Das MQTT-Gateway.</b> Die Themengruppe dieses Plugins:"
M_S2_V2 = "Gateway V2: unter <i>Dienste → MQTT Gateway → Subscriptions</i> erscheint die Gruppe %s. Diese Datenpunkte anhaken:"
M_HAKEN_AUF = "Hakenliste: %d Datenpunkte"
M_WEITERE = "Weitere Themen ohne Haken (%d): Texte und Kennwerte, die die Musterseiten nicht brauchen, und das Alter für bestehende Anlagen"
M_NONCACHED = "Kein Thema braucht „Noncached“ oder „Zurücksetzen nach Senden“: alle sind Zustände, Messwerte oder Zähler."
M_RECONNECT = "Nach einem Neustart des Miniservers: die Zustände (auch die Zahlenfelder) sind zurückbehalten, zaehler und ok kommen binnen 5 Minuten, die Messwerte holt der zentrale <span class='sm-mono'>reconnect</span> (Musterprojekt, Seite „LoxBerry MQTT-Gateway“) bzw. der volle Versand spätestens nach 30 Minuten."
M_V1_BEFEHLE = "Unter Gateway V1 nimmt das Abo auch die Befehlsthemen und Quittungen mit; das Gateway legt dafür Eingänge <span class='sm-mono'>…_befehl_…</span> an. Kein Befehl im Musterprojekt heißt so – eine Schleife entsteht nicht."
M_S3 = "<b>Eingänge anlegen.</b> Je Wert ein <b>Virtueller Eingang</b> (Texte: <b>Virtueller Texteingang</b>), Name genau wie in der Tabelle – unter diesem Namen liefert das MQTT-Gateway. Eine Vorlage für Werte gibt es nicht: die Namen reichen."
M_S3_LEER = "Noch kein Geräte-Abbild – die Tabelle zeigt nur das Lebenszeichen. Nach dem ersten erfolgreichen Abruf (Reiter <i>Test</i>) stehen hier die Namen aller Geräte."
M_S3_DIGITAL = "„Als Digitaleingang verwenden“ nicht anhaken – auch nicht bei online, maeht, station, offen, an und stoerung."
M_S3_FEHLWERT = "-1 bzw. -999 heißt: wird von der Wolke gerade nicht geliefert. Die Zahlenfelder senden ohne Wert 0."
M_S3_RECHTE = "Der LoxBerry-Benutzer am Miniserver braucht Rechte auf diese Eingänge."
M_S3_MUSTER = "Wer die Seiten aus dem Musterprojekt kopiert, bekommt die Eingänge mit – der Gerätename steckt aber im Namen: die Namen auf die eigenen Geräte umstellen."
M_S3_PRAEFIX = "Basisthema im Reiter <i>MQTT</i> geändert oder ein Gerät in der GARDENA-App umbenannt? Dann ändern sich die Namen."
M_KOPIEREN = "kopieren"
M_KOPIERT = "kopiert"
