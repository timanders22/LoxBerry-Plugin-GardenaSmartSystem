ZU_NAMEN = "Zu den Namen:"
ZU_NAMEN_TEXT = "Die Namen der virtuellen Eingänge sind keine Vorschläge: das MQTT-Gateway legt die Eingänge unter genau diesem Namen an (das Thema mit <span class='sm-mono'>_</span> statt <span class='sm-mono'>/</span>). Wer den Namen ändert, bekommt beim nächsten Empfang einen zweiten Eingang, der nie verdrahtet ist. Den lesbaren Anzeigenamen setzen Sie in Loxone Config als Beschreibung. Die übrigen Bausteine dürfen heißen, wie Sie wollen. Die vollständigen Themen aller Geräte stehen im Reiter MQTT."
LZ_TS = "Unix-Zeit des letzten Durchgangs"
LZ_ZAEHLER = "Zähler, wandert bei jedem Durchgang (0 bis 999)"
BREMSEN = "Bremsen gegen einen flatternden Baustein: <b>?action=refresh</b> wird frühestens 60 Sekunden nach dem letzten Lauf angenommen (sonst HTTP 429), <b>?action=command</b> höchstens 30-mal je Stunde (sonst HTTP 429). Während einer Abrufsperre nach HTTP 429 von Husqvarna weisen beide mit HTTP 503 ab, ohne etwas zu senden. Steht „Plugin aktiv“ auf Nein, weisen beide mit HTTP 409 ab. Befehle an ein Gerät mit mehreren Diensten gleicher Art (etwa mehreren Ventilen) weist der Endpunkt ebenfalls mit HTTP 409 ab, bis an echter Hardware gemessen ist, wie die Wolke ein solches Gerät liefert. Ventil- und Steckdosenbefehle (VALVE_CONTROL, POWER_SOCKET_CONTROL): derselbe Befehl mit derselben Dauer an dasselbe Ventil bzw. dieselbe Steckdose innerhalb von 60 Sekunden geht nicht erneut an die Wolke – der Endpunkt antwortet mit HTTP 200 und UNVERAENDERT=1, und der Befehl zählt nicht gegen die 30 je Stunde. Mäherbefehle gehen jedes Mal hinaus. Ein Virtueller Ausgang wertet die Antwort nicht aus — wer sich wundert, sieht im Reiter Logdateien nach."
