SEKUNDEN_HINWEIS = "<span class='sm-mono'>seconds</span> ist ein Vielfaches von 60. Fehlt der Wert bei <span class='sm-mono'>START_SECONDS_TO_OVERRIDE</span>, nimmt das Plugin 3600 (eine Stunde). Obergrenze je Befehl: Ventil %d h, Mäher und Steckdose %d h — darüber weist der Endpunkt mit HTTP 400 ab. Dauerhaft einschalten geht bei der Steckdose nur über <span class='sm-mono'>START_OVERRIDE</span>."
H_SICHER = "Zum Token in der Adresse"
SICHER = "Das Token steht als Klartext in der Adresse des Virtuellen Ausgangs. Das ist bei Loxone nicht anders zu lösen — ein Virtueller Ausgang kann keine eigene Kopfzeile mitschicken. Der Aufruf bleibt im Heimnetz; wichtig ist deshalb vor allem, den LoxBerry <b>nicht</b> per Portfreigabe ins Internet zu stellen."

