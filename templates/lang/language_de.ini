HINWEISE_TITEL = "Hinweise"
OHNE_ABBILD = "Noch kein Geräte-Abbild: die Tabellen zeigen die Beispielnamen des Musterprojekts (Maehroboter, Ventil Beet, Sensor Beet, Steckdose Teich). Nach dem ersten erfolgreichen Abruf stehen hier die Namen der eigenen Geräte."
