; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "GARDENA smart system"
K02 = "Holt alle fünf Minuten die Werte sämtlicher GARDENA-smart-system-Geräte — Mähroboter, Bewässerungscomputer und Ventile, Sensoren, Steckdosen und das Gateway — und reicht sie an den Miniserver weiter, per MQTT und auf Wunsch zusätzlich per UDP. In der Gegenrichtung lassen sich Befehle senden: Mähen starten, Parken, Bewässerung starten und stoppen."
K03 = "So gehen Sie vor"
K04 = "Bei <b>Husqvarna</b> unter <span class='sm-mono'>developer.husqvarnagroup.cloud</span> anmelden, eine Anwendung anlegen und ihr die <i>GARDENA smart system API</i> zuordnen. Sie erhalten dabei einen <b>Application Key</b> und ein <b>Secret</b>."
K05 = "<b>Einstellungen:</b> Key und Secret eintragen und speichern."
K06 = "<b>MQTT:</b> das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K07 = "<b>Einbindung in Loxone:</b> die Vorlage erzeugen und in Loxone Config einfügen."
K08 = "Warum Key und Secret und nicht Benutzername und Passwort"
K09 = "Die alte <i>sg-1</i>-Schnittstelle mit Benutzername und Passwort hat GARDENA <b>abgeschaltet</b>. Ältere Fassungen dieses Plugins funktionieren deshalb nicht mehr — das ist kein Fehler, der sich beheben ließe. Seit Fassung 1.0.0 wird die <i>smart system API v2</i> mit OAuth2 benutzt."
K10 = "Anfragegrenzen"
K11 = "Husqvarna begrenzt die Zahl der Abrufe je Tag. Der Fünf-Minuten-Takt ist so gewählt, dass er darunter bleibt. Wer ihn verkürzt, riskiert, dass die Schnittstelle für den Rest des Tages abweist."
K12 = "Ein Befehl wird von der Cloud <b>entgegengenommen</b>, nicht ausgeführt. Ob der Mähroboter tatsächlich losfährt, zeigt erst der nächste Abruf."
K13 = "Wenn keine Werte kommen"
K14 = "Reiter <i>Test</i>: dort wird die Anmeldung einzeln geprüft. Ein abgelehnter Key ist die häufigste Ursache."
K15 = "Ist der Anwendung im Husqvarna-Portal die <b>API auch zugeordnet</b>? Ein Key ohne zugeordnete Schnittstelle sieht gültig aus und wird trotzdem abgewiesen."
K16 = "Reiter <i>Logdateien</i>: die Antwort der Cloud steht dort im Wortlaut."
K17 = "Grundlage"
K18 = "Die Anbindung nutzt die öffentliche Schnittstellenbeschreibung von Husqvarna. Sie ist herstellerseitig dokumentiert, kann sich aber ändern — wie schon einmal geschehen, als sg-1 abgeschaltet wurde."
