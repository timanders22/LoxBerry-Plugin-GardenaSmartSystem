; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "GARDENA smart system"
K02 = "Fetches the values of all GARDENA smart system devices every five minutes — robotic mowers, irrigation controls and valves, sensors, sockets and the gateway — and passes them on to the Miniserver via MQTT and, if you wish, additionally via UDP. In the other direction commands can be sent: start mowing, park, start and stop irrigation."
K03 = "How to proceed"
K04 = "Sign in with <b>Husqvarna</b> at <span class='sm-mono'>developer.husqvarnagroup.cloud</span>, create an application and connect the <i>GARDENA smart system API</i> to it. You will receive an <b>application key</b> and a <b>secret</b>."
K05 = "<b>Settings:</b> enter the key and secret and save."
K06 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K07 = "<b>Loxone integration:</b> generate the template and paste it into Loxone Config."
K08 = "Why a key and secret rather than a user name and password"
K09 = "GARDENA has <b>switched off</b> the old <i>sg-1</i> interface that used a user name and password. Older versions of this plugin therefore no longer work — that is not a fault that could be fixed. Since version 1.0.0 the <i>smart system API v2</i> with OAuth2 is used."
K10 = "Request limits"
K11 = "Husqvarna limits the number of calls; how high the limit is has not been measured by this plugin. One run needs two calls. If the interface answers HTTP 429, the plugin waits out the lock instead of knocking again and says so on the Test tab. The interval can be stretched in the settings."
K12 = "A command is <b>accepted</b> by the cloud, not executed by it. Whether the mower actually sets off only shows on the next fetch."
K13 = "If no values arrive"
K14 = "<i>Test</i> tab: it shows whether key and secret are stored, when the last poll succeeded and whether a polling lock is active. “Poll now” starts a poll; whether the login was accepted is then shown on the <i>Log files</i> tab."
K15 = "Is the <b>API actually connected</b> to the application in the Husqvarna portal? A key without a connected interface looks valid and is still rejected."
K16 = "<i>Log files</i> tab: the cloud's reply appears there verbatim."
K17 = "Basis"
K18 = "The connection uses the public interface description by Husqvarna. It is documented by the manufacturer but may change — as it did once before, when sg-1 was switched off."
