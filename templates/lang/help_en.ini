; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "GARDENA smart system"
K02 = "Fetches the values of all GARDENA smart system devices every five minutes — robotic mowers, irrigation controls and valves, sensors, sockets and the gateway — and passes them on to the Miniserver via MQTT and via UDP (both switched on by default; UDP can be switched off in the settings). In the other direction commands can be sent: start mowing, park, start and stop irrigation."
K03 = "How to proceed"
K04 = "Sign in with <b>Husqvarna</b> at <span class='sm-mono'>developer.husqvarnagroup.cloud</span>, create an application and connect the <i>GARDENA smart system API</i> to it. You will receive an <b>application key</b> and a <b>secret</b>."
K05 = "<b>Settings:</b> enter the key and secret, set <b>Plugin active</b> to <i>Yes</i> and save. By default it is <i>No</i> — then nothing is polled and commands from Loxone are rejected."
K06 = "<b>MQTT:</b> under MQTT&#8209;gateway&nbsp;V1 the plugin enters its subscription itself; from version&nbsp;2 the topic group appears under Subscriptions – tick the data points of the tick list there (tab Loxone integration). Commands from Loxone via MQTT only work with the ticks “Accept commands via MQTT” and “Switch devices via MQTT” (both off by default)."
K07 = "<b>Loxone integration:</b> Virtual Inputs with the names of the name table (copy button), commands on the shared output “LoxBerry MQTT-Gateway”; four block pages from the shared sample project (pictures and instructions per page) show how values and commands are wired. UDP path and HTTP commands remain for existing installations."
K08 = "Why a key and secret rather than a user name and password"
K09 = "GARDENA has <b>switched off</b> the old <i>sg-1</i> interface that used a user name and password. Older versions of this plugin therefore no longer work — that is not a fault that could be fixed. Since version 1.0.0 the <i>smart system API v2</i> with OAuth2 is used."
K10 = "Request limits"
K11 = "Husqvarna limits the number of calls; how high the limit is has not been measured by this plugin. One run needs two calls. If the interface answers HTTP 429, the plugin waits out the lock instead of knocking again and says so on the Test tab. The interval can be stretched in the settings."
K12 = "A command is <b>accepted</b> by the cloud, not executed by it. Whether the mower actually sets off only shows on the next fetch."
K13 = "If no values arrive"
K14 = "<i>Test</i> tab: it shows whether key and secret are stored, when the last poll succeeded and whether a polling lock is active. “Poll now” starts a poll; whether the login was accepted is then shown on the <i>Log files</i> tab."
K15 = "Is the <b>API actually connected</b> to the application in the Husqvarna portal? A key without a connected interface looks valid and is still rejected."
K16 = "<i>Log files</i> tab: the cloud's reply appears there verbatim."
K17 = "Basis"
K19 = "Interface for the irrigation plugin"
K20 = "<b>Off</b> by default (Settings tab). When switched on, the <i>Bewässerung</i> (irrigation) plugin on this LoxBerry may open the GARDENA valves directly, close them and read their state: a POST to <span class='sm-mono'>http://127.0.0.1/plugins/gardenasmartsystem/index.php</span> with <span class='sm-mono'>action=ventil</span>, its own valve token, the device name and <span class='sm-mono'>befehl=oeffnen</span> (with <span class='sm-mono'>minuten</span>), <span class='sm-mono'>schliessen</span> or <span class='sm-mono'>zustand</span>. Maximum duration per opening adjustable (1–180 minutes); “Plugin enabled: No” blocks; devices with several valves are rejected."
K21 = "The same valve or socket command with the same duration within 60 seconds goes to the cloud only once – for valves from Loxone as well as from the irrigation plugin; the answer then says UNVERAENDERT=1. Mower commands are sent every time. In the Test tab, “Show raw device list” shows the cloud answer without account identifiers."
K18 = "The connection uses the public interface description by Husqvarna. It is documented by the manufacturer but may change — as it did once before, when sg-1 was switched off."
K22 = "Announcements and gateway V2"
K23 = "Announcements can also run via <b>Sonos4Lox</b> and <b>SonoX</b> (since 1.2.22, not selected by default, unmeasured – no Sonos in the house); the Test tab checks that the plugin is installed and knows the zone or room. <b>SonoX sends the announcement text to Google</b> (speech synthesis there) and only answers after playback (up to 30 s). Under MQTT gateway V2 the Test tab checks that all data points of the tick list are ticked and “Noncached” is right."
K24 = "<b>Several speakers at once</b> (since 1.2.22, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 1.2.22 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output."
