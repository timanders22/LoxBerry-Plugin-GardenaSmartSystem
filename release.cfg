[AUTOUPDATE]
; Diese Datei liegt im Wurzelverzeichnis des Repositories. LoxBerry liest sie
; dort ueber die RELEASECFG-Adresse aus der plugin.cfg und vergleicht VERSION
; mit der installierten Fassung.
;
; Zwei Adressen, zwei verschiedene Quellen - das ist die haeufigste
; Fehlerstelle: die plugin.cfg liest DIESE Datei aus dem ZWEIG master, das
; ARCHIVEURL unten zieht aber aus dem TAG. Wer hier etwas aendert, ohne den
; Tag mitzuziehen, liefert an neue Installationen weiter den alten Stand aus.
;
; Bei jedem Release VERSION und BEIDE Adressen auf den neuen Tag anpassen -
; und danach nachpruefen, dass der Tag wirklich existiert.

VERSION=1.1.4
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/archive/refs/tags/v1.1.4.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/releases/tag/v1.1.4
