[AUTHOR]
# You can also use a Team/Projekt Name here and a generic email address 
# like info@..., BUT NEVER CHANGE this information in future updates! It
# will be used to identify your Plugin, handle updates etc. If you change
# this information, LoxBerry could not identify your plugin and handle it as
# a different one - therefore updates will fail.
NAME=Michael Jani		
EMAIL=michael.d.jani@gmail.com

[PLUGIN]
# The version of your plugin - important if you would like to write an
# upgrade script.
# V1.0.0 Komplett-Update: Husqvarna/GARDENA API v2 (OAuth2), neue Admin-UI
#        (LoxBerry 4), MQTT via LoxBerry MQTT Gateway, PHP 7.4/8 kompatibel
# V1.0.1 Installation robuster: php-curl ist keine harte Voraussetzung mehr
#        (automatischer Ersatzweg ueber PHP-Streams), Hinweis in der Oberflaeche
# V1.0.2 Zugriffstoken fuer ?action=command und ?action=refresh - ohne Token
#        konnte jedes Geraet im Netz Maeher und Ventile schalten. Token wird
#        beim ersten Oeffnen der Oberflaeche erzeugt und dort angezeigt.
# V1.1.0 gardenaMain.php nach bin/ verlegt (lag im Apache-Wurzelverzeichnis
#        und war ohne Anmeldung aufrufbar), Update-Skripte ohne den festen
#        Pfad /tmp/uploads/, Konfiguration wird beim Speichern zusammen-
#        gefuehrt statt ueberschrieben, ?action=list verlangt das Token,
#        Sperre gegen gleichzeitige Abrufe, Oberflaeche nach Hausstandard
#        mit Reitern und zweisprachig.
VERSION=1.1.0

# Short name and prefered subfolder of your Plugin (do not use blanks - they
# will be filtered - and use lowercase only)! Used for script names in
# daemon or cron (NAME) and as unique installation folder. If these names
# already exist on the installation system, we will add 01, 02, 03 and so
# on. Therefore your script should check THESE TWO VARIABLES for figuring
# out subfolder and scriptnames! You will find this information in
# /data/system/plugindatabase.dat after installation!  BUT NEVER CHANGE this
# information in future updates! It will be used to identify your Plugin,
# handle updates etc. If you change this information, Loxberry could not
# identify your plugin and will handle it as a different one - therefore
# updates will definetely fail.
NAME=gardenasmartsystem
FOLDER=gardenasmartsystem

# Friendly Long Name of your Plugin - 25 Characters maximum! All others maybe 
# replaced by "...". You can use blanks, uppercase/lowercase etc.
TITLE=Gardena-Smart-System

[AUTOUPDATE]
# Selbstaktualisierung ueber das eigene Repository.
#
# Die Adressen zeigen auf den Zweig master - LoxBerry liest die Fassung dort
# und vergleicht sie mit der oben. Solange beide 1.1.0 lauten, wird niemandem
# etwas angeboten; sobald der Zweig eine hoehere Fassung fuehrt, greift die
# Aktualisierung von selbst.
#
# Die Adressen NIE auf ein fremdes Repository richten: LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.1.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
#
# NAME, FOLDER und die Angaben unter [AUTHOR] bleiben BEWUSST unveraendert:
# LoxBerry erkennt ein Plugin genau an diesen drei Angaben. Wer sie aendert
# - etwa fuer eine Abspaltung unter neuem Namen -, bekommt bei allen
# bestehenden Installationen eine zweite, parallel installierte Fassung
# statt eines Updates. Beide wuerden dann alle fuenf Minuten dieselben Daten
# abrufen und an denselben UDP-Port des Miniservers senden.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/master/prerelease.cfg

[SYSTEM]
# Plugin Interface
# Do not change this if you are not knowing what you are doing!
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
