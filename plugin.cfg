[AUTHOR]
# You can also use a Team/Projekt Name here and a generic email address 
# like info@..., BUT NEVER CHANGE this information in future updates! It
# will be used to identify your Plugin, handle updates etc. If you change
# this information, LoxBerry could not identify your plugin and handle it as
# a different one - therefore updates will fail.
NAME=GardenaSmartSystem Plugin Authors
EMAIL=gardenasmartsystem@users.noreply.github.com

[PLUGIN]
# The version of your plugin - important if you would like to write an
# upgrade script.
# V1.0.0 Komplett-Update: Husqvarna/GARDENA API v2 (OAuth2), neue Admin-UI
#        (LoxBerry 4), MQTT via LoxBerry MQTT Gateway, PHP 7.4/8 kompatibel
# V1.0.1 Installation robuster: php-curl ist keine harte Voraussetzung mehr
#        (automatischer Ersatzweg ueber PHP-Streams), Hinweis in der Oberflaeche
# V1.0.2 Zugriffstoken fuer ?action=command und ?action=refresh - ohne Token
#        konnte jedes Geraet im Netz Maeher und Ventile schalten. Token wird
#        beim ersten Oeffnen der Oberflaeche erzeugt und dort angezeigt.
# V1.1.0 gardenaMain.php nach bin/ verlegt (lag im Apache-Wurzelverzeichnis
#        und war ohne Anmeldung aufrufbar), Update-Skripte ohne den festen
#        Pfad /tmp/uploads/, Konfiguration wird beim Speichern zusammen-
#        gefuehrt statt ueberschrieben, ?action=list verlangt das Token,
#        Sperre gegen gleichzeitige Abrufe, Oberflaeche nach Hausstandard
#        mit Reitern und zweisprachig.
# V1.2.0 Vorlage und Sender bauen die Themen aus EINER Quelle - die Titel der
#        Loxone-Vorlage passten bei jedem Geraetenamen mit Leerzeichen oder
#        Umlaut nicht zu den gesendeten Themen, die Eingaenge blieben leer.
#        Vorgabewerte stehen an einer Stelle (MQTT war nach einem Update aus,
#        waehrend die Oberflaeche "Aktiv" anzeigte). Wache vor socket_create
#        (ohne php-sockets starb der Lauf beim ersten Wert). Zustellungen
#        werden gezaehlt statt geschaetzt. Neu: Lebenszeichen fuer die
#        Ausfallerkennung, Selbstpruefung im Reiter Test, ?selftest=1.
#        Dazu: ein Attribut ohne Wert wird nicht mehr als leere Zeile
#        gesendet (in Loxone von einer gemessenen 0 nicht zu unterscheiden),
#        der Reiter Logdateien zeigt ueber LBWeb::loglist_html() die
#        Protokolle des Plugins statt einer nie beschriebenen Datei, der
#        Endpunkt weist Feld-Parameter ab (?device[]=x endete unter PHP 8
#        mit HTTP 500 und leerem Rumpf), und jedes Formular traegt ein
#        Merkmal gegen fremde Absender. Aufgeraeumt: der Pluginordner
#        kommt aus einer Quelle statt aus einem falschen Rueckfallwert,
#        die Reiter-Bereiche heissen sm-seite wie im Hausstandard, und
#        leere Textwerte sind im Reiter Einbindung in Loxone erklaert.
#        Neue Funktionen: Abrufabstand einstellbar, HTTP 429 wird
#        abgewartet statt ignoriert, Standortliste einen Tag lang
#        wiederverwendet, Senden nur bei Aenderung (sonst alle 30
#        Minuten als Lebenszeichen), weggefallene MQTT-Themen werden
#        geleert, Geraete lassen sich vom Versand ausnehmen,
#        Wartungszaehler fuer den Messerwechsel (ab Werk aus), Abo und
#        Themen-Tabelle im MQTT-Reiter, Baustein-Liste und UDP-Vorlage
#        im Reiter Einbindung in Loxone, Zeitstempel der Wolke je
#        Geraet. NICHT umgesetzt und im README begruendet:
#        Mehrventil-Geraete, Zustaende als Zahl, WebSocket - bei allen
#        dreien ist die Voraussetzung nicht gemessen.
# V1.2.1 bis V1.2.5
#        Aus Durchgaengen ueber den ganzen Plugin-Bestand, nicht aus einer
#        Sitzung an dieser Linie. Was sie im Einzelnen geaendert haben, ist
#        hier nicht nachgehalten; die Release-Seiten auf GitHub nennen es.
#        1.2.4 brachte clearstatcache() vor die Protokollkappung (siehe
#        README, Abschnitt "Fassung 1.2.4").
# V1.2.6 Durchsicht vom 05.09.2026, gemessen gegen PHP 7.4.33 und 8.4.24.
#        Schwer: die Sicherungsdatei pruefte nur Schluesselnamen, nie Werte -
#        ueber einen Zeilenumbruch liess sich das Aktionstoken setzen; ein
#        unlesbares 'seconds' und ein fehlendes 'type' wurden am Endpunkt
#        geraten statt abgewiesen; ein gescheiterter Abruf leerte den
#        Geraete-Zwischenspeicher; die Deinstallation liess drei
#        Zweitschriften mit Zugangsdaten liegen; die UDP-Vorlage baute ihren
#        Suchtext getrennt vom Sender.
#        Dazu: der Endpunkt protokolliert jetzt jeden Weg (gebremst), das
#        Lebenszeichen geht nicht mehr retained hinaus und steht in der
#        Importvorlage, ausgenommene Geraete kommen nicht mehr in die
#        Eingangsvorlagen, die Konfiguration wird vervollstaendigt, das
#        Application Secret steht nicht mehr im Seitenquelltext, und die
#        tote CSS-Klasse sm-warnung ist ersetzt.
#        Ausserdem: eine vorhandene, aber unlesbare gardena.cfg wird nicht
#        mehr durch eine neue mit neuem Token ersetzt - das machte jede im
#        Miniserver eingetragene Adresse stumm ungueltig.
#        UMSTIEG: '&type=' ist am Endpunkt jetzt Pflicht; ?selftest=1
#        liefert TOKEN=1 statt TOKEN=OK.
VERSION=1.2.6
# Short name and prefered subfolder of your Plugin (do not use blanks - they
# will be filtered - and use lowercase only)! Used for script names in
# daemon or cron (NAME) and as unique installation folder. If these names
# already exist on the installation system, we will add 01, 02, 03 and so
# on. Therefore your script should check THESE TWO VARIABLES for figuring
# out subfolder and scriptnames! You will find this information in
# /data/system/plugindatabase.dat after installation!  BUT NEVER CHANGE this
# information in future updates! It will be used to identify your Plugin,
# handle updates etc. If you change this information, Loxberry could not
# identify your plugin and will handle it as a different one - therefore
# updates will definetely fail.
NAME=gardenasmartsystem
FOLDER=gardenasmartsystem

# Friendly Long Name of your Plugin - 25 Characters maximum! All others maybe 
# replaced by "...". You can use blanks, uppercase/lowercase etc.
TITLE=Gardena-Smart-System

[AUTOUPDATE]
# Selbstaktualisierung ueber das eigene Repository.
#
# Die Adressen zeigen auf den Zweig master - LoxBerry liest die Fassung dort
# und vergleicht sie mit der oben. Solange beide dieselbe Nummer fuehren, wird
# niemandem etwas angeboten; sobald der Zweig eine hoehere Fassung fuehrt,
# greift die Aktualisierung von selbst. (Bis 1.2.5 stand hier eine feste
# Nummer als Beispiel - sie war vier Staende lang falsch, und wer die
# Selbstaktualisierung nachvollzog, verglich gegen die falsche Zahl.)
#
# Die Adressen NIE auf ein fremdes Repository richten: LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als jede
# Nummer dieser Linie -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
#
# NAME, FOLDER und die Angaben unter [AUTHOR] bleiben BEWUSST unveraendert:
# LoxBerry erkennt ein Plugin genau an diesen drei Angaben. Wer sie aendert
# - etwa fuer eine Abspaltung unter neuem Namen -, bekommt bei allen
# bestehenden Installationen eine zweite, parallel installierte Fassung
# statt eines Updates. Beide wuerden dann alle fuenf Minuten dieselben Daten
# abrufen und an denselben UDP-Port des Miniservers senden.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-GardenaSmartSystem/master/prerelease.cfg

[SYSTEM]
# Plugin Interface
# Do not change this if you are not knowing what you are doing!
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
